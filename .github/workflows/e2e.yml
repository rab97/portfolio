name: End-to-end tests

# Separato dal deploy apposta: richiede il download di un browser Chromium, e
# tenerlo qui vuol dire che non allunga né blocca la pubblicazione — questo
# workflow e quello di deploy partono in parallelo sullo stesso push.
#
# Gira anche sui push del branch principale, non solo sulle pull request:
# questo è un portfolio personale, i push arrivano dritti su `main` e senza
# questa riga la suite end-to-end — e con lei tutti i controlli di
# accessibilità, che vivono solo qui perché hanno bisogno di un browser vero —
# non girerebbe praticamente mai.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts costruisce da sé dist/ e lo serve con `vite
      # preview`, impostando VITE_SITE_URL sull'origine locale del server:
      # non serve ripeterlo qui.
      - name: End-to-end tests
        run: npm run test:e2e
